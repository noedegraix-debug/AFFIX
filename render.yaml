# Déploiement en un clic sur Render (Blueprint) : crée le site + sa base de données.
# Pour de vraies données de production, passe les deux plans en "starter" / "basic-256mb".
services:
  - type: web
    name: blue-dash
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blue-dash-db
          property: connectionString
databases:
  - name: blue-dash-db
    plan: free
