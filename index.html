<title>AFFIX</title>
<style>
:root{--bg:#000;--card:rgba(24,24,26,.72);--bd:rgba(255,255,255,.11);--tx:#f5f5f5;--dim:#9a9aa2;--a:#ffffff;--b:#a1a1aa;--ic:#e5e5e5;--amb:#eab308;--grn:#4ade80;--red:#fca5a5;--ease:cubic-bezier(.16,1,.3,1);--easeStd:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
html{scroll-behavior:smooth}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:radial-gradient(120% 55% at 50% 0,color-mix(in srgb,var(--a) 16%,#000) 0,color-mix(in srgb,var(--a) 5%,#000) 40%,transparent 75%),radial-gradient(90% 45% at 80% 105%,color-mix(in srgb,var(--b) 14%,#000) 0,transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
#app{max-width:547px;margin:0 auto}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:9px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.12)}
header b{font-size:14px;font-weight:700}
.burger{width:46px;height:39px;border-radius:10px;border:0;background:rgba(255,255,255,.08);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:transform .18s var(--spring),background-color .2s ease}
.burger:active{transform:scale(.88)}
main{padding:14px 20px 60px;animation:riseIn .5s var(--ease)}
main>.card,main>.stats>.stat,main>.stat{animation:riseIn .5s var(--ease) backwards}
main>.card:nth-child(1),main>.stats:nth-child(1)>.stat{animation-delay:.03s}
main>.card:nth-child(2),main>.stats:nth-child(1)>.stat:nth-child(2){animation-delay:.08s}
main>.card:nth-child(3){animation-delay:.13s}
main>.card:nth-child(4){animation-delay:.18s}
main>.card:nth-child(5){animation-delay:.23s}
main>.card:nth-child(6){animation-delay:.28s}
main>.card:nth-child(n+7){animation-delay:.32s}
h1{font-size:27px;line-height:1.1;font-weight:800;margin:4px 0 6px;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:13px;line-height:1.45;margin:0 0 20px}
.card{background:linear-gradient(160deg,rgba(34,34,37,.75),rgba(8,8,9,.88));border:1px solid var(--bd);border-radius:17px;padding:15px;margin-bottom:13px;position:relative}
.card h3{margin:0 0 10px;font-size:14px;font-weight:700}
.card{transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.35)}}
.card p{color:var(--dim);font-size:12px;line-height:1.5;margin:0 0 14px}
.inner{background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:11px;padding:10px;margin-bottom:10px}
.inner small{display:block;color:var(--dim);font-weight:600;margin-bottom:4px;font-size:11px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;font-size:12px}
.btn{border:0;border-radius:11px;padding:10px 26px;font-size:13px;font-weight:700;color:#000;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 10px 30px color-mix(in srgb,var(--a) 35%,transparent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;transition:transform .16s var(--spring),box-shadow .2s var(--easeStd),opacity .2s ease,filter .2s ease}
.btn:active{transform:scale(.95);box-shadow:0 4px 14px color-mix(in srgb,var(--a) 30%,transparent)}
.btn:hover{filter:brightness(1.06)}
.btn.g{background:rgba(255,255,255,.03);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.g:active{transform:scale(.95);background:rgba(255,255,255,.08)}
.btn.g:hover{filter:none;background:rgba(255,255,255,.07)}
.btn.s{padding:6px 18px;font-size:11px;border-radius:8px}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(252,165,165,.4);box-shadow:none}
.btn.danger:active{transform:scale(.95);background:rgba(252,165,165,.1)}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.row>.n{flex:0 0 auto}
label{display:block;font-size:10px;letter-spacing:.06em;font-weight:700;color:var(--dim);text-transform:uppercase;margin:13px 0 8px}
input,select,textarea{width:100%;background:#0a0a0a;border:1px solid var(--bd);border-radius:11px;padding:11px 18px;color:var(--tx);font-size:13px;font-family:inherit;outline:0;transition:border-color .2s var(--easeStd),box-shadow .2s var(--easeStd),background-color .2s ease}
input:focus,textarea:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 16%,transparent);background:#121212}
input::placeholder,textarea::placeholder{color:#6b6b73}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.stat{background:linear-gradient(160deg,rgba(34,34,37,.7),rgba(8,8,9,.88));border:1px solid var(--bd);border-radius:17px;padding:15px 22px}
.stat span{display:block;font-size:10px;letter-spacing:.09em;font-weight:700;color:var(--dim);text-transform:uppercase;margin-bottom:7px}
.stat b{font-size:29px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:599px;padding:6px 18px;font-weight:700;font-size:12px;border:1px solid var(--bd)}
.pill.ok{color:var(--grn);border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.08)}
.pill.b{color:#f0f0f0;border-color:rgba(255,255,255,.35);background:color-mix(in srgb,var(--a) 10%,transparent)}
.badge{background:var(--amb);color:#1a1200;border-radius:599px;font-weight:800;font-size:11px;padding:4px 11px}
.tabs{display:flex;background:rgba(255,255,255,.03);border-radius:13px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:none;color:var(--tx);font-weight:700;font-size:12px;padding:10px 8px;border-radius:11px;font-family:inherit;cursor:pointer;transition:background-color .3s var(--easeStd),color .3s var(--easeStd),transform .15s var(--spring)}
.tabs button.on{background:linear-gradient(90deg,var(--a),var(--b));color:#000;animation:popIn .35s var(--ease)}
.tabs button:active{transform:scale(.95)}
.tw{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;min-width:374px}
th{text-align:left;font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;padding:11px 16px;font-weight:700}
td{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
tr.click{cursor:pointer;transition:background-color .2s ease}
tr.click:active{background:rgba(255,255,255,.05)}
@media(hover:hover){tr.click:hover{background:rgba(255,255,255,.04)}}
.code{background:rgba(255,255,255,.07);border-radius:7px;padding:4px 14px;font-family:ui-monospace,monospace;font-size:12px}
.blue{color:#fff;font-weight:800}
.empty{color:var(--dim);text-align:center;padding:19px 16px;font-size:12px}
.bar{height:14px;background:rgba(255,255,255,.1);border-radius:59px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:59px}
.drawer{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.97);backdrop-filter:blur(10px);padding:62px 22px 30px;overflow:auto;opacity:0;visibility:hidden;transform:translateY(-10px);transition:opacity .32s var(--easeStd),transform .32s var(--ease),visibility 0s linear .32s}
.drawer.on{opacity:1;visibility:visible;transform:translateY(0);transition:opacity .32s var(--easeStd),transform .32s var(--ease),visibility 0s}
.drawer a{display:flex;align-items:center;gap:13px;padding:12px 22px;border-radius:12px;color:#e5e5e5;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;margin-bottom:4px;cursor:pointer;transition:background-color .2s ease,transform .15s var(--spring),border-color .2s ease;animation:riseIn .4s var(--ease) backwards}
.drawer a:active{transform:scale(.97)}
.drawer.on a:nth-child(1){animation-delay:.04s}.drawer.on a:nth-child(2){animation-delay:.08s}.drawer.on a:nth-child(3){animation-delay:.12s}.drawer.on a:nth-child(4){animation-delay:.16s}.drawer.on a:nth-child(5){animation-delay:.2s}.drawer.on a:nth-child(6){animation-delay:.24s}.drawer.on a:nth-child(7){animation-delay:.28s}.drawer.on a:nth-child(8){animation-delay:.32s}.drawer.on a:nth-child(9){animation-delay:.36s}
.drawer a.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
.drawer a svg{color:var(--ic);flex:0 0 auto}
.drawer a .badge{margin-left:auto}
.faq{background:linear-gradient(160deg,rgba(34,34,37,.7),rgba(8,8,9,.88));border:1px solid var(--bd);border-radius:16px;padding:14px 24px;margin-bottom:10px}
.faq summary{font-weight:700;font-size:14px;cursor:pointer;list-style:none}
.faq summary::before{content:"▶ ";font-size:12px}
.faq p{margin:8px 0 0;color:var(--dim);font-size:12px;line-height:1.5}
.sec{font-size:12px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin:18px 0 12px;font-weight:500}
.warn{border-color:rgba(200,90,110,.45)}
.step{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.step i{width:37px;height:37px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));color:#000;font-style:normal;font-weight:800;font-size:16px;display:grid;place-items:center;flex:0 0 auto}
.step h4{margin:0;font-size:17px}
.note{background:color-mix(in srgb,var(--a) 12%,transparent);border:1px solid rgba(255,255,255,.3);color:#e5e5e5;border-radius:11px;padding:10px;font-size:12px}
.game{display:flex;align-items:center;gap:13px;padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(160deg,rgba(34,34,37,.7),rgba(8,8,9,.88));margin-bottom:11px;color:#fff;font-size:17px;font-weight:800;text-decoration:none}
.game .gi{width:49px;height:49px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;border:1px solid rgba(255,255,255,.22)}
.game svg.s{margin-left:auto;color:#fff}
.msg{display:flex;justify-content:space-between;gap:8px;padding:12px 24px;border-top:1px solid rgba(255,255,255,.06);cursor:pointer}
.msg b{font-size:17px;display:block;margin-bottom:4px}
.msg span{color:var(--dim);font-size:13px}
.bub{max-width:82%;padding:7px 16px;border-radius:11px;margin-bottom:7px;font-size:12px;line-height:1.4}
.bub.me{margin-left:auto;background:linear-gradient(90deg,var(--a),var(--b));color:#000}
.bub.o{background:rgba(255,255,255,.08)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a1a;border:1px solid var(--bd);padding:9px 22px;border-radius:59px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease);z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:15px;animation:popIn .55s var(--ease)}
.login h2{text-align:center;font-size:23px;margin:0 auto 22px}
.chk{display:flex;align-items:center;gap:14px;font-size:14px;margin:10px 0;cursor:pointer;user-select:none}
.chk input{position:absolute;opacity:0;width:0;height:0}
.chk .sw{position:relative;width:46px;height:27px;background:rgba(255,255,255,.14);border-radius:99px;transition:background-color .25s var(--easeStd);flex:0 0 auto}
.chk .sw::after{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;background:#fff;border-radius:50%;transition:transform .3s var(--spring);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.chk input:checked+.sw{background:linear-gradient(90deg,var(--a),var(--b))}
.chk input:checked+.sw::after{transform:translateX(19px)}
.rlink{display:flex;gap:8px}
.rlink input{flex:1}
.x{flex:0 0 auto;width:auto;padding:7px 22px;border-radius:59px;background:transparent;border:1px solid var(--bd);color:var(--ic);font-size:14px;cursor:pointer;transition:transform .16s var(--spring),background-color .2s ease}
.x:active{transform:scale(.9);background:rgba(255,255,255,.06)}
.seg{display:inline-flex;background:#0a0a0a;border:1px solid var(--bd);border-radius:59px;padding:4px}
.seg button{border:0;background:none;color:var(--dim);font-weight:700;font-size:14px;padding:7px 24px;border-radius:59px;cursor:pointer;font-family:inherit;transition:background-color .3s var(--easeStd),color .3s var(--easeStd),transform .15s var(--spring)}
.seg button.on{background:linear-gradient(90deg,var(--a),var(--b));color:#000;animation:popIn .3s var(--ease)}
.seg button:active{transform:scale(.93)}
.bl{display:flex;align-items:center}
.lg{display:block;width:clamp(92px,24vw,132px);height:auto;max-height:40px;object-fit:contain;object-position:left center;margin:0;border-radius:0;user-select:none;-webkit-user-drag:none}
.login .lg{width:min(52vw,200px);max-height:none;object-position:center;margin:0 auto}
@media(min-width:700px){.lg{width:clamp(110px,14vw,150px);max-height:46px}.login .lg{width:min(40vw,230px)}}
@media(max-width:340px){.lg{width:88px}}
@media(max-height:480px) and (orientation:landscape){.login{justify-content:flex-start;padding-top:calc(12px + env(safe-area-inset-top,0px))}.login h2{margin-bottom:14px}.login .lg{width:min(30vw,170px)}}
.login h2.bl{justify-content:center}
.login>*{width:100%;max-width:440px;margin-left:auto;margin-right:auto}
@media(min-width:700px){
#app{max-width:900px}
main{padding:22px 32px 70px}
h1{font-size:30px}.sub{font-size:15px}
.card{padding:20px}.card p{font-size:14px}
.stat b{font-size:30px}
.stats:has(>.stat:nth-child(6)){grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1000px){
#app.shell{max-width:1500px;display:grid;grid-template-columns:260px minmax(0,1fr);align-items:start}
#app.shell header{grid-column:1/-1}
#app.shell .burger{display:none}
#app.shell .drawer{position:sticky;inset:auto;top:68px;height:calc(100vh - 68px);opacity:1;visibility:visible;transform:none;background:transparent;backdrop-filter:none;padding:18px 14px;border-right:1px solid var(--bd);z-index:5;transition:none}
#app.shell .drawer a{font-size:14px;padding:11px 16px;animation:none}
#app.shell main{padding:28px 44px 80px;max-width:1100px;width:100%}
.stats:has(>.stat:nth-child(4):last-child){grid-template-columns:repeat(4,1fr)}
h1{font-size:34px}
td,th{font-size:14px}
input,select,textarea{font-size:14px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ============ ÉTAT (stocké dans le navigateur, comme Lexora Dash) ============ */
const KEY='bluedash_v1';
const BR=window.BRAND||{brand:'AFFIX',colorA:'#ffffff',colorB:'#a1a1aa',logo:'/assets/logo.png'};
const brand=()=>(S&&S.settings&&S.settings.brand)||BR.brand;

const hdrs=()=>({'Content-Type':'application/json','x-role':auth?auth.role:'','x-name':encodeURIComponent((auth&&auth.name)||''),'x-code':encodeURIComponent((auth&&auth.code)||'')});
async function api(path,method='GET',body){
 let r;try{r=await fetch(path,{method,headers:hdrs(),body:body!==undefined?JSON.stringify(body):undefined})}catch(e){throw new Error('Serveur injoignable')}
 let d=null;try{d=await r.json()}catch(e){}
 if(r.status===401&&auth){logout();throw new Error('Session expirée')}
 if(!r.ok)throw new Error((d&&d.error)||'Erreur serveur');
 return d;
}
function applyState(d){S=Object.assign(def(),d,{settings:Object.assign(def().settings,d.settings)})}
async function loadState(){applyState(await api('/api/state'));if(auth&&auth.role==='m'&&S.subs[0]&&session)session.id=S.subs[0].id;ready=true}
function save(){if(!auth||auth.role!=='a')return;clearTimeout(saveT);saveT=setTimeout(pushConfig,250)}
async function pushConfig(){try{await api('/api/config','PUT',{settings:S.settings,subs:S.subs.map(x=>({id:x.id,name:x.name,code:x.code,links:x.links,commission:x.commission,landing:x.landing,referrer:x.referrer,created:x.created})),announce:S.announce})}catch(e){toast(e.message)}}
const sigOf=()=>JSON.stringify([S.payments,S.msgs,S.rewardsClaimed,S.announce,S.subs.map(x=>[x.id,x.stats,(x.events||[]).length])]);
const safeToRender=()=>{const a=document.activeElement;return !(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&!drawer&&(editing===null||page==='msg')};
async function refresh(silent){
 if(!auth)return;
 try{
  const d=await api('/api/state');
  if(auth.role==='a'){S.payments=d.payments;S.msgs=d.msgs;S.rewardsClaimed=d.rewardsClaimed;d.subs.forEach(n=>{const o=S.subs.find(x=>x.id===n.id);if(o){o.stats=n.stats;o.events=n.events}})}
  else applyState(d);
  const sg=sigOf();
  if(!silent||(sg!==lastSig&&safeToRender()))render();
  lastSig=sg;
 }catch(e){if(!silent)toast(e.message)}
}

function animateStats(){
 document.querySelectorAll('.stat b').forEach(el=>{
  if(el.dataset.animated)return;el.dataset.animated='1';
  const txt=el.textContent.trim();const m=txt.match(/^(-?[\d.,\s]+)(.*)$/);if(!m)return;
  const numStr=m[1].replace(/\s/g,'').trim(),suffix=m[2];
  const target=parseFloat(numStr.replace(',','.'));if(isNaN(target))return;
  const decimals=(numStr.split(',')[1]||'').length;
  let t0=null;const dur=750;
  function step(ts){if(!t0)t0=ts;const p=Math.min(1,(ts-t0)/dur);const eased=1-Math.pow(1-p,3);const cur=target*eased;
   el.textContent=(decimals?cur.toLocaleString('fr-FR',{minimumFractionDigits:decimals,maximumFractionDigits:decimals}):Math.round(cur).toLocaleString('fr-FR'))+suffix;
   if(p<1)requestAnimationFrame(step);else el.dataset.animated=''}
  requestAnimationFrame(step);
 });
}

 <label>Paramètre du sous-affilié dans les liens (Blue Affiliates : s1)</label><input id="n_lsub" value="${esc(st.linkParam||'s1')}"><label>Macro renvoyée dans le postback (Blue Affiliates : sub1)</label><input id="n_sub" value="${esc(st.param)}">
 <div class="row"><div><label>Paramètre « événement »</label><input id="n_event" value="${esc((st.map||{}).event)}"></div><div><label>Paramètre « montant »</label><input id="n_amount" value="${esc((st.map||{}).amount)}"></div></div>
 <div class="row"><div><label>Paramètre « commission »</label><input id="n_commission" value="${esc((st.map||{}).commission)}"></div><div><label>Paramètre « id transaction »</label><input id="n_tx" value="${esc((st.map||{}).tx)}"></div></div>
 <div class="row"><div><label>Événement : inscription</label><input id="n_reg" value="${esc((st.map||{}).reg)}"></div><div><label>Événement : 1er dépôt (FTD)</label><input id="n_ftd" value="${esc((st.map||{}).ftd)}"></div></div>
 <div class="row"><div><label>Événement : dépôt</label><input id="n_dep" value="${esc((st.map||{}).dep)}"></div><div><label>Événement : commission</label><input id="n_com" value="${esc((st.map||{}).com)}"></div></div>
 <label>Secret HMAC Blue Affiliates (pour vérifier {sig})</label><input id="n_secret" type="password" autocomplete="off" placeholder="Colle ici le secret de ton compte Blue Affiliates" value="${esc(st.baSecret||'')}"><p style="margin:8px 0 0">${(S.pb&&S.pb.last)?'✅ Dernier postback reçu : '+new Date(S.pb.last).toLocaleString('fr-FR')+' ('+S.pb.count+' événements)':'⏳ Aucun postback reçu pour le moment.'}</p><div class="row"><div><label>Symbole macro gauche</label><input id="n_l" value="${esc(st.macroL)}"></div><div><label>Symbole macro droit</label><input id="n_r" value="${esc(st.macroR)}"></div></div>
 <div style="height:17px"></div><button class="btn" onclick="saveNetwork()">Enregistrer</button></div>
 <div class="card"><h3>Notifications Telegram</h3><p>Reçois un message Telegram quand un sous-affilié t'écrit ou demande un retrait. Crée un bot via @BotFather, puis récupère l'ID de la conversation où l'envoyer.</p><label class="chk"><input type="checkbox" id="t_on" ${st.tgOn?'checked':''}><i class="sw"></i><span>Activer les notifications Telegram</span></label><label>Token du bot</label><input id="t_tok" placeholder="123456789:AAExxxxxxxxxxxx" value="${esc(st.tgToken)}"><label>Chat ID</label><input id="t_chat" placeholder="Ex : 123456789 ou -1001234567890" value="${esc(st.tgChat)}"><div class="row" style="margin-top:17px"><button class="btn n" onclick="saveTg()">Enregistrer</button><button class="btn g n" onclick="testTg()">Envoyer un test</button></div></div>
 <div class="card"><h3>Programme de parrainage</h3><p>Montant versé automatiquement à un sous-affilié pour chaque FTD généré par un filleul qu'il a parrainé.</p><label>Commission par FTD (€)</label><input id="s_ref" type="number" value="${st.refComm}"><div style="height:17px"></div><button class="btn" onclick="S.settings.refComm=+$('#s_ref').value||0;save();toast('Enregistré')">Enregistrer</button></div>
 <div class="card"><h3>Liens "Communauté" (espace membre)</h3><p>Ajoute un ou plusieurs liens (Telegram, Discord...). L'onglet "Communauté" n'apparaît que s'il y a au moins un lien.</p>${st.community.length?linkList('community'):'<p>Aucun lien pour le moment, ajoute-en un.</p>'}<div class="row" style="justify-content:flex-start"><button class="btn g s n" onclick="S.settings.community.push({name:'',url:''});render()">+ Ajouter un lien</button><button class="btn s n" onclick="save();toast('Enregistré')">Enregistrer</button></div></div>
 <div class="card"><h3>Liens "Jeux" (espace membre)</h3><p>Ajoute un ou plusieurs jeux (chacun avec son propre nom). L'onglet "Jeux" n'apparaît chez tes sous-affiliés que s'il y a au moins un lien.</p>${linkList('games')}<div class="row" style="justify-content:flex-start"><button class="btn g s n" onclick="S.settings.games.push({name:'',url:''});render()">+ Ajouter un jeu</button><button class="btn s n" onclick="save();toast('Enregistré')">Enregistrer</button></div></div>
 <div class="card"><h3>Liens "Liens utiles" (espace membre)</h3><p>Ajoute un ou plusieurs liens (chacun avec son propre nom). Cet onglet apparaît chez tes sous-affiliés, juste en dessous de "Parrainage", uniquement s'il y a au moins un lien.</p>${st.useful.length?linkList('useful'):'<p>Aucun lien pour le moment, ajoute-en un.</p>'}<div class="row" style="justify-content:flex-start"><button class="btn g s n" onclick="S.settings.useful.push({name:'',url:''});render()">+ Ajouter un lien</button><button class="btn s n" onclick="save();toast('Enregistré')">Enregistrer</button></div></div>
 <div class="card"><h3>Paliers de rewards</h3><p>Nombre de FTD à atteindre et montant du bonus (une fois par participant).</p>${st.tiers.map((t,i)=>`<div class="row" style="margin-bottom:7px;flex-wrap:nowrap"><input type="number" value="${t.ftd}" oninput="S.settings.tiers[${i}].ftd=+this.value" placeholder="FTD"><input type="number" value="${t.reward}" oninput="S.settings.tiers[${i}].reward=+this.value" placeholder="Bonus €"><button class="x n" onclick="S.settings.tiers.splice(${i},1);render()">✕</button></div>`).join('')}<div class="row" style="justify-content:flex-start"><button class="btn g s n" onclick="S.settings.tiers.push({ftd:0,reward:0});render()">+ Ajouter un palier</button><button class="btn s n" onclick="S.settings.tiers.sort((a,b)=>a.ftd-b.ftd);save();toast('Paliers enregistrés');render()">Enregistrer les paliers</button></div></div>
 <div class="card"><h3>Retraits mensuels</h3><p>Chaque sous-affilié peut demander en une fois la totalité de ses gains (FTD × commission) accumulés depuis son dernier retrait. Seul le jour du mois est retenu : l'ouverture des retraits se répète chaque mois à ce même jour.</p><label>Date de référence</label><input id="s_wd" type="date" value="${new Date(2026,8,st.wDay).toISOString().slice(0,10)}"><p style="margin-top:8px">Jour d'ouverture actuel : le ${st.wDay} de chaque mois.</p><button class="btn" onclick="S.settings.wDay=new Date($('#s_wd').value).getDate()||10;save();toast('Enregistré');render()">Enregistrer</button></div>
 <div class="card"><h3>Changer le code d'accès admin</h3><label>Code actuel</label><input id="c_old" type="password"><label>Nouveau code</label><input id="c_new" type="password"><div style="height:17px"></div><button class="btn" onclick="chCode()">Mettre à jour</button></div>
 <div class="card"><h3>Exporter / Importer les données</h3><p>Sauvegarde toutes tes données dans un fichier, ou restaure-les depuis une sauvegarde.</p><div class="row" style="justify-content:flex-start"><button class="btn g s n" onclick="exportData()">Exporter (.json)</button><button class="btn g s n" onclick="$('#imp').click()">Importer un fichier</button></div><input type="file" id="imp" accept=".json" style="display:none" onchange="importData(this.files[0])"></div>
 <div class="card" style="border-color:rgba(252,165,165,.3)"><h3 style="color:var(--red)">Zone de danger</h3><p>Réinitialiser efface tous les sous-affiliés et toutes les statistiques de ce navigateur, sans retour possible.</p><button class="btn danger s" onclick="resetAll()">Réinitialiser toutes les données</button></div>`;
}
function saveBrand(){const s=S.settings;s.brand=$('#b_name').value.trim()||'AFFIX';s.colorA=$('#b_a').value;s.colorB=$('#b_b').value;s.logo=$('#b_logo').value.trim();save();applyBrand();toast('Enregistré');render()}
function saveNetwork(){const s=S.settings,v=id=>$('#'+id).value.trim();s.param=v('n_sub').replace(/[^\w-]/g,'')||'sub1';s.linkParam=v('n_lsub').replace(/[^\w-]/g,'')||'s1';s.map=Object.assign(s.map||{},{event:v('n_event'),amount:v('n_amount'),commission:v('n_commission'),tx:v('n_tx'),reg:v('n_reg'),ftd:v('n_ftd'),dep:v('n_dep'),com:v('n_com')});s.baSecret=($('#n_secret')||{value:s.baSecret||''}).value.trim();s.macroL=v('n_l')||'{';s.macroR=v('n_r')||'}';save();toast('Enregistré');render()}
function saveTg(){Object.assign(S.settings,{tgOn:$('#t_on').checked,tgToken:$('#t_tok').value.trim(),tgChat:$('#t_chat').value.trim()});save();toast('Enregistré')}
async function testTg(){saveTg();clearTimeout(saveT);await pushConfig();try{await api('/api/tg-test','POST',{});toast('Message Telegram envoyé')}catch(e){toast(e.message)}}
async function chCode(){const o=$('#c_old').value,n=$('#c_new').value;if(!o||!n)return toast('Remplis les deux champs');try{await api('/api/admin-code','POST',{old:o,next:n});auth.code=n;S.defaultCode=false;localStorage.setItem(AUTH_KEY,JSON.stringify(auth));$('#c_old').value='';$('#c_new').value='';toast('Code mis à jour')}catch(e){toast(e.message)}}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=brand().toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);await api('/api/import','POST',{state:d});await loadState();lastSig=sigOf();toast('Importé');render()}catch(e){toast(e.message||'Fichier invalide')}};r.readAsText(f)}
async function resetAll(){if(!confirm('Tout effacer ? Sous-affiliés, messages, retraits et statistiques seront supprimés.'))return;try{await api('/api/reset','POST',{});await loadState();lastSig=sigOf();toast('Données réinitialisées');render()}catch(e){toast(e.message)}}

/* ============ SYNCHRO POSTBACKS (fusion: le serveur ne met à jour QUE les stats) ============ */
async function syncAll(){await refresh(false);toast('Actualisé')}

/* ============ MEMBRE ============ */
function memberPage(){return({home:mHome,tuto:mTuto,msg:mMsg,bal:mBal,rew:mRew,ref:mRef,tips:tips,games:mGames,comm:mComm})[page]()}
function mHome(){
 const s=me(),st=stat(s),conv=st.inscriptions?(st.ftd/st.inscriptions*100).toFixed(1):'0.0';
 const links=(s.links||[]).map(l=>`<div class="inner"><small>${esc(l.name)}</small><div class="mono">${esc(withSub(l.url,s.code))}</div><button class="btn s" style="margin-top:8px" onclick="copy('${esc(withSub(l.url,s.code))}')">Copier</button></div>`).join('');
 return `<div class="row" style="justify-content:space-between;margin-bottom:4px"><div class="pill ok n">${ic.bell} Notifications activées</div><a onclick="syncSelf()" style="color:var(--dim);cursor:pointer;font-size:13px;display:flex;gap:5px;align-items:center;justify-content:flex-end">${ic.sync} Actualiser</a></div>
 <h1 style="font-size:26px">Bonjour, ${esc(s.name)} 👋</h1><p class="sub">Aperçu de votre activité</p>
 ${S.announce.length?`<div class="card" style="border-color:rgba(255,255,255,.35)"><h3>📣 Annonce</h3><p style="margin:0;color:var(--tx)">${esc(S.announce[0].text)}</p></div>`:''}
 <div class="card"><h3 style="color:var(--dim);font-size:14px">Tes liens d'affiliation</h3>${links||'<p>Aucun lien pour le moment.</p>'}</div>
 ${s.landing?`<div class="card"><h3 style="color:var(--dim);font-size:14px">Ta landing page</h3><div class="inner"><div class="mono">${esc(s.landing)}</div><p style="margin:6px 0 12px">💡 À utiliser en priorité sur TikTok, elle convertit généralement mieux qu'un lien direct.</p><button class="btn s" onclick="copy('${esc(s.landing)}')">Copier</button></div></div>`:''}
 <div class="stats"><div class="stat"><span>Inscriptions</span><b>${st.inscriptions}</b></div><div class="stat"><span>FTD</span><b>${st.ftd}</b></div><div class="stat"><span>Conversion</span><b>${conv}%</b></div><div class="stat"><span>Dépôts</span><b>${eur(st.deposits)}</b></div><div class="stat"><span>Mes revenus</span><b>${eur(earned(s))}</b></div><div class="stat"><span>Chiffre d'affaires</span><b>${eur(st.ca)}</b></div></div>`;
}
function syncSelf(){refresh(false).then(()=>toast('Actualisé'))}
function mTuto(){
 const s=me(),l=(s.links||[])[0],g=S.settings.games[0];
 const st=(n,t,body)=>`<div class="card"><div class="step"><i>${n}</i><h4>${t}</h4></div>${body}</div>`;
 return `<div style="color:var(--ic);font-weight:700;letter-spacing:.08em;font-size:13px">TUTORIEL</div><h1 style="font-size:27px">Comment générer tes premiers FTD 🔥</h1><p class="sub">Bienvenue ${esc(s.name)} — suis ces 5 étapes pour toucher tes premiers paiements.</p>
 ${g?`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div style="color:var(--ic);font-weight:700;letter-spacing:.08em;font-size:11px">JEU SUGGÉRÉ</div><b style="font-size:17px">${esc(g.name)}</b></div><a class="btn g s" href="${esc(withSub(g.url,s.code))}" target="_blank">Ouvrir</a></div>`:''}
 ${st(1,'Copie ton lien personnel',`<p>Ce lien est unique à toi. Chaque inscription et chaque FTD sont trackés automatiquement.</p>${l?`<div class="inner row" style="flex-wrap:nowrap"><div class="mono">${esc(withSub(l.url,s.code))}</div><button class="x n" onclick="copy('${esc(withSub(l.url,s.code))}')">${ic.copy}</button></div>`:''}<p>💡 Ne change jamais ce lien — toutes tes performances passées y sont attachées.</p>`)}
 ${st(2,'Mets-le dans ta bio',`<p>TikTok/Instagram → Profil → Modifier le profil → colle ton lien dans le champ "Site web".</p><div class="note">⚠️ Sans lien en bio, aucune conversion possible — c'est le seul moyen pour les gens de cliquer.</div>`)}
 ${st(3,'Crée du contenu',`<p>Montre l'ambiance, partage des moments marquants. Les vidéos qui marchent partagent un point commun :</p><ul style="color:var(--dim);font-size:12px;line-height:1.7"><li>3-5 premières secondes <b style="color:var(--tx)">accrocheuses</b></li><li>Format vertical, durée 15-60 secondes</li><li>Un CTA clair en fin de vidéo : « Lien en bio »</li></ul><p>Plus d'astuces détaillées dans l'onglet "Conseils & Stratégie".</p>`)}
 ${st(4,'Poste et laisse le lien 48h minimum',`<p>🕐 Heures de pointe : 18h-23h<br>📌 Une fois posté, ne change pas ton lien en bio pendant 48h minimum.<br>🔁 La régularité fait le coup d'éclat — vise 1 publication par jour.</p>`)}
 ${st(5,'Suis tes FTD',`<p>Dès qu'un joueur clique ton lien et dépose, ça apparaît sur ton tableau de bord (après synchronisation).</p><button class="btn g" onclick="go('home')">📊 Voir mon tableau de bord</button>`)}
 <p style="text-align:center;color:var(--dim)">Bloqué ? Contacte-moi via l'onglet <a onclick="go('msg')" style="color:var(--tx);text-decoration:underline;cursor:pointer">Messages</a>.</p>`;
}
function mMsg(){const s=me(),th=S.msgs[s.id]||[];return `<h1>Messages</h1><p class="sub">Écris directement à ton parrain principal.</p><div class="card">${th.map(m=>`<div class="bub ${m.from==='m'?'me':'o'}">${esc(m.text)}</div>`).join('')||'<div class="empty">Aucun message pour le moment.</div>'}<div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="mt" placeholder="Ton message"><button class="btn n" onclick="sendMsg('${s.id}','m')">Envoyer</button></div></div>`}
function canWithdraw(){const s=me();return s&&new Date().getDate()===S.settings.wDay&&balance(s)>0}
function mBal(){
 const s=me(),b=balance(s),tot=earned(s),wd=withdrawn(s.id),h=S.payments.filter(p=>p.subId===s.id&&p.type==='w');
 return `<h1>Solde & Retraits</h1><p class="sub">Ton solde correspond à l'ensemble de tes gains (FTD × commission) non encore retirés. Les retraits s'ouvrent le ${S.settings.wDay} de chaque mois et couvrent la totalité du solde disponible.</p>
 <div class="stats"><div class="stat" style="min-height:130px"><span style="text-transform:none;letter-spacing:0;font-size:13px;font-weight:500">Solde disponible</span><b>${eur(b)}</b></div><div class="stat"><span style="text-transform:none;letter-spacing:0;font-size:13px;font-weight:500">Total gagné à ce jour</span><b>${eur(tot)}</b><p style="margin:6px 0 0;color:var(--dim);font-size:12px">dont ${eur(wd)} déjà demandés/retirés</p></div></div>
 <div class="card"><button class="btn" onclick="askWd()">${ic.wallet.replace(/width="28" height="28"/,'width="22" height="22"')} Demander mon retrait — ${eur(b)}</button>${canWithdraw()?'':`<p style="margin:10px 0 0">Prochaine ouverture : le ${S.settings.wDay} du mois.</p>`}</div>
 <div class="sec" style="font-weight:700">Historique des retraits</div>${h.map(p=>`<div class="card"><b style="font-size:17px">${eur(p.amount)}</b><p style="margin:6px 0 12px">Demandé le ${fmtD(p.date)} · 🏦 Virement bancaire</p><span class="pill ${p.status==='paid'?'ok':'b'} s">${p.status==='paid'?'Payé le '+fmtD(p.paidAt):'En attente'}</span></div>`).join('')||'<div class="empty">Aucun retrait.</div>'}`;
}
async function askWd(){if(!canWithdraw())return toast(`Retraits ouverts le ${S.settings.wDay} du mois`);const d=prompt('Tes coordonnées de paiement (IBAN / crypto) :');if(!d)return;try{await api('/api/me/withdraw','POST',{details:d});toast('Demande envoyée');await refresh(false)}catch(e){toast(e.message)}}
function mRew(){
 const s=me(),f=stat(s).ftd,cl=S.rewardsClaimed[s.id]||[];
 return `<h1>Rewards</h1><p class="sub">Consultez les bonus disponibles et débloquez-les en cumulant des premiers dépôts (FTD).</p><div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:15px"><span style="color:var(--dim);font-size:13px">Ton total de FTD confirmés</span><b style="font-size:24px">${f}</b></div>
 ${S.settings.tiers.map((t,i)=>{const ok=f>=t.ftd,done=cl.includes(t.ftd);return `<div class="card"><div class="row" style="flex-wrap:nowrap;gap:10px;align-items:flex-start"><div class="n" style="width:40px;height:55px;border-radius:14px;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;color:var(--ic);background:rgba(255,255,255,.06)">${i===0?ic.shield:ic.gift}</div><div><h3 style="margin:0 0 6px;font-size:17px">Bonus ${t.ftd} FTD</h3><p style="margin:0">Atteindre ${t.ftd} premiers dépôts pour remporter ce reward. Une fois par participant.</p></div></div><div style="margin:13px 0 14px"><span class="pill ${ok?'ok':'b'} s">+${eur(t.reward)}</span></div><div class="bar"><i style="width:${Math.min(100,f/t.ftd*100)}%"></i></div><div class="row" style="margin-top:7px;justify-content:space-between;color:var(--dim);font-size:12px"><span>${ok?'Débloqué ✔':'Progression'}</span><span style="text-align:right">${Math.min(f,t.ftd)} / ${t.ftd}</span></div>${ok&&!done?`<button class="btn" style="margin-top:11px" onclick="claimRew(${t.ftd})">${ic.wallet.replace(/width="28" height="28"/,'width="22" height="22"')} Demander mon reward</button>`:''}${done?'<p style="margin:10px 0 0;color:var(--grn)">Reward déjà demandé ✔</p>':''}</div>`}).join('')}`;
}
async function claimRew(ftd){const d=prompt('Tes coordonnées de paiement (IBAN / crypto) :');if(!d)return;try{await api('/api/me/claim','POST',{ftd,details:d});toast('Demande envoyée');await refresh(false)}catch(e){toast(e.message)}}
function mRef(){
 const s=me(),url=location.href.split('?')[0]+'?ref='+encodeURIComponent(s.code),fil=S.subs.filter(x=>x.referrer===s.id);
 const msg=`Rejoins-moi sur ${brand()} : ${url}`;
 return `<h1>Parrainage</h1><p class="sub">Parraine d'autres affiliés et gagne ${eur(S.settings.refComm)} pour chaque FTD qu'ils génèrent.</p>
 <div class="card"><h3>Comment parrainer ?</h3><p>Invite quelqu'un à rejoindre l'équipe et dis à l'admin qu'il vient de ta part : il sera rattaché à toi et tu touches ${eur(S.settings.refComm)} pour chaque FTD qu'il génère.</p></div>
 <div class="stats"><div class="stat"><span>Filleuls</span><b>${fil.length}</b></div><div class="stat"><span>Revenus de parrainage</span><b>${eur(fil.reduce((a,f)=>a+stat(f).ftd*S.settings.refComm,0))}</b></div></div>
 <div class="card tw"><h3 style="padding:14px 24px 0">Mes filleuls</h3><table><tr><th>Nom</th><th>Depuis le</th><th>Statut</th><th>FTD générés</th></tr>${fil.map(f=>`<tr><td>${esc(f.name)}</td><td>${fmtD(f.created)}</td><td>${stat(f).ftd?'Actif':'Inscrit'}</td><td>${stat(f).ftd}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Tu n\'as encore parrainé personne.</td></tr>'}</table></div>
